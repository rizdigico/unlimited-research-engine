use_default_settings: true

server:
  # Upstream placeholder: the container entrypoint replaces this with a freshly
  # generated random key on every start. No real secret is committed.
  secret_key: "ultrasecretkey"
  limiter: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20

# Engines enabled for the no-API research stack. All run without API keys.
# More engines = wider coverage + more distributed request load.
engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false
  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: false
  - name: yahoo
    engine: yahoo
    shortcut: yh
    disabled: false
  - name: yahoo news
    engine: yahoo_news
    shortcut: yhn
    disabled: false
  - name: presearch
    engine: presearch
    shortcut: ps
    disabled: false
  - name: yep
    engine: yep
    shortcut: ye
    disabled: false
  - name: marginalia
    engine: marginalia
    shortcut: mg
    disabled: false
  - name: google scholar
    engine: google_scholar
    shortcut: gs
    disabled: false
  - name: crossref
    engine: crossref
    shortcut: cr
    disabled: false
  - name: pubmed
    engine: pubmed
    shortcut: pm
    disabled: false
